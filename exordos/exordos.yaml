# Build section. It specifies the build process of the project
build:

  # Dependencies of the project
  deps:
    - dst: /opt/exordos_metapaas
      path:
        src: ../../exordos_metapaas
      exclude:
        - .venv
        - .tox
        - output

    # Take SDK from a local path for development purposes.
    - dst: /opt/gcl_sdk
      optional: true
      path:
        env: LOCAL_GENESIS_SDK_PATH

  # List of elements in the project
  elements:
    # The metapaas control-plane image (single image hosting all PaaS plugins)
    - manifest: manifests/metapaas.yaml.j2
      images:
      - name: exordos-metapaas
        format: GEN_IMG_FORMAT_CORE=zst
        profile: exordos_base
        script: images/cp_install.sh

        # Override image build parameters, for instance disk size
        override:
          disk_size: "10G"

