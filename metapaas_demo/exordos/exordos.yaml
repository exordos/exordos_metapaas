# Self-contained build config for the reference demo PaaS. Kept strictly inside
# metapaas_demo/ so the prod exordos_metapaas element never ships the demo.
build:
  deps:
    - dst: /opt/exordos_metapaas
      path:
        src: ../../metapaas_demo
      exclude:
        - .venv
        - .tox
        - output

  elements:
    # demo-aas install manifest: registers the demo PaaS type in metapaas,
    # its IAM permissions and the metapaas-demo-namespaced dataplane version.
    - manifest: manifests/metapaas-demo.yaml.j2

    # Example consumer element: declaratively creates a demo instance.
    - manifest: manifests/example_demo.yaml.j2

    # demo dataplane image (launched per demo instance by the infra builder)
    - manifest: manifests/metapaas-demo.yaml.j2
      artifacts:
        - script: images/build_wheel.sh
          name: pypi_package
          artifacts:
            - ../dist/*.whl
      images:
      - name: exordos-metapaas-demo-dp
        format: GEN_IMG_FORMAT_CORE=zst
        profile: exordos_base
        script: images/dp_install.sh
        override:
          disk_size: "6G"
          use_backing_file: true
